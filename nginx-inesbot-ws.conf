# InesBot nginx — HTTP only (redireciona para HTTPS se tiveres SSL)
# Para HTTPS com Let's Encrypt: sudo certbot --nginx -d o-teu-dominio.com

server {
    listen 80;
    server_name _;   # substituir pelo teu domínio ou IP

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Tudo passa pelo FastAPI (inclui auth)
    location / {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

