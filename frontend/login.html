<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0e13">
    <title>InesBot - Login</title>
    <style>
        :root {
            --bg-primary: #0c0e13;
            --bg-secondary: #13161d;
            --text-primary: #f0506e;
            --text-secondary: #e8eaf0;
            --text-muted: #8a91a3;
            --btn-primary: linear-gradient(135deg, #f0506e, #ff8a5c);
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: #1a1e27;
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: rgba(240, 80, 110, 0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #f0506e, #ff8a5c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-top: 6px;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 13px 16px;
            color: var(--text-secondary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(240, 80, 110, 0.12);
        }

        input::placeholder { color: var(--text-muted); }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--btn-primary);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
        }

        .btn-login:hover { opacity: 0.9; }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

        .error-msg {
            display: none;
            background: rgba(233, 69, 96, 0.12);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 8px;
            padding: 11px 14px;
            color: #ff6b8a;
            font-size: 0.88rem;
            margin-bottom: 18px;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-header">
            <div class="logo">🤖</div>
            <h1>InesBot</h1>
            <p>Introduz as tuas credenciais para entrar</p>
        </div>

        <div class="login-card">
            <div class="error-msg" id="error-msg"></div>

            <div class="form-group">
                <label for="username">Utilizador</label>
                <input type="text" id="username" placeholder="O teu utilizador" autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn-login" id="btn-login">Entrar</button>
        </div>

        <p class="footer-note">InesBot © 2025</p>
    </div>

    <script>
        const usernameEl = document.getElementById('username');
        const passwordEl = document.getElementById('password');
        const btnLogin   = document.getElementById('btn-login');
        const errorMsg   = document.getElementById('error-msg');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }

        function setLoading(loading) {
            btnLogin.disabled = loading;
            btnLogin.innerHTML = loading
                ? '<span class="spinner"></span>A entrar...'
                : 'Entrar';
        }

        async function doLogin() {
            const username = usernameEl.value.trim();
            const password = passwordEl.value;

            if (!username || !password) {
                showError('Preenche o utilizador e a password.');
                return;
            }

            hideError();
            setLoading(true);

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'same-origin'
                });

                const data = await resp.json();

                if (resp.ok && data.ok) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Erro ao fazer login.');
                    passwordEl.value = '';
                    passwordEl.focus();
                }
            } catch (e) {
                showError('Erro de ligação. Tenta novamente.');
            } finally {
                setLoading(false);
            }
        }

        btnLogin.addEventListener('click', doLogin);

        [usernameEl, passwordEl].forEach(el => {
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter') doLogin();
            });
        });
    </script>
</body>
</html>
